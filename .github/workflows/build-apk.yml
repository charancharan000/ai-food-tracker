name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install

      - name: Prebuild Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --clean

      - name: Make Gradle executable
        working-directory: mobile/android
        run: chmod +x gradlew

      - name: Build Standalone Release APK
        working-directory: mobile/android
        run: |
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/ai-food-tracker.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-food-tracker-apk
          path: mobile/android/app/build/outputs/apk/release/ai-food-tracker.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.2-apk
          name: "AI Food Tracker v1.0.2 APK"
          body: |
            ### AI Food Tracker Android APK v1.0.2 (Pro Membership & Support Center)
            Download the standalone `.apk` directly to your Android device.

            **Highlights:**
            - Private Google Live Sheets Webhook integration for user registrations.
            - Dedicated in-app Support Center (Email: codewithsan0607@gmail.com).
            - Pro VIP Membership Club with exclusive features:
              • AI Smart Meal Planner & Recipe Generator
              • AI Nutrition Coach interactive assistant
              • Clinical-grade macro and micronutrient targets
            - Embedded Hermes bytecode JavaScript bundle.

            **Installation Instructions:**
            1. Download `ai-food-tracker.apk` below directly on your Android phone.
            2. If updating from previous version, tap Update.
            3. Launch AI Food Tracker.
          files: |
            mobile/android/app/build/outputs/apk/release/ai-food-tracker.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
