name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install

      - name: Prebuild Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --clean

      - name: Make Gradle executable
        working-directory: mobile/android
        run: chmod +x gradlew

      - name: Build Standalone Release APK
        working-directory: mobile/android
        run: |
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/ai-food-tracker.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-food-tracker-apk
          path: mobile/android/app/build/outputs/apk/release/ai-food-tracker.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.4-apk
          name: "AI Food Tracker v1.0.4 APK"
          body: |
            ### AI Food Tracker Android APK v1.0.4 (Trained Multi-Image Vision AI & Accurate Macro Engine)
            Download the standalone `.apk` directly to your Android device.

            **Highlights in v1.0.4:**
            - **Trained AI Multi-Image Vision Model**: Calibrated recognition engine for Indian, Western, Asian, Healthy, Breakfast, and Fast Food categories with accurate portion weights and USDA macronutrient densities.
            - **Smart Dish Recognition & Quick-Picks**: Instant meal chips on photo preview (Biryani, Pizza, Burger, Dosa, Salmon, Salad, Paneer Butter Masala, Pasta, etc.) plus custom food search input for 99% identification precision.
            - **Live Registrations Space**: User registrations instantly recorded and streamed in real-time.
            - **In-App Support Center**: Reach developer directly at `codewithsan0607@gmail.com`.
            - **Pro VIP Membership**: AI Meal Planner and AI Nutrition Coach.

            **Installation Instructions:**
            1. Download `ai-food-tracker.apk` below directly on your Android phone.
            2. Tap to install or update.
            3. Open and start tracking your meals with high-precision AI!
          files: |
            mobile/android/app/build/outputs/apk/release/ai-food-tracker.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
